name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Require a version tag matching package.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import packageJson from './package.json' with { type: 'json' }

          const expectedTag = `v${packageJson.version}`
          if (process.env.RELEASE_TAG !== expectedTag) {
            console.error(`Tag ${process.env.RELEASE_TAG} does not match package version ${packageJson.version}.`)
            console.error(`Create and push the tag ${expectedTag} instead.`)
            process.exit(1)
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test server
        run: npm run test:server

      - name: Build macOS installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      - name: Publish private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.dmg \
            release/*.zip \
            --verify-tag \
            --generate-notes \
            --title "Rautml ${GITHUB_REF_NAME}"
