name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Require a version tag matching package.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import packageJson from './package.json' with { type: 'json' }

          const expectedTag = `v${packageJson.version}`
          if (process.env.RELEASE_TAG !== expectedTag) {
            console.error(`Tag ${process.env.RELEASE_TAG} does not match package version ${packageJson.version}.`)
            console.error(`Create and push the tag ${expectedTag} instead.`)
            process.exit(1)
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test server
        run: npm run test:server

      - name: Prepare Apple signing materials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "Signing secrets are missing; building an unsigned app."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          else
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            if [ ! -s "$RUNNER_TEMP/certificate.p12" ]; then
              echo "Decoded Developer ID certificate is empty."
              exit 1
            fi
            echo "CSC_LINK=$RUNNER_TEMP/certificate.p12" >> "$GITHUB_ENV"
            {
              echo "CSC_KEY_PASSWORD<<EOF"
              echo "$MACOS_CERTIFICATE_PASSWORD"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

          if [ -n "$APPLE_API_KEY_CONTENT" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          else
            echo "Notarization secrets are not set; skipping notarization."
          fi

      - name: Build macOS installers
        run: npm run dist:mac

      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt

      - name: Publish private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.dmg \
            release/*.zip \
            release/latest-mac.yml \
            release/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "Rautml ${GITHUB_REF_NAME}"
